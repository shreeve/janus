<!doctype html>
<!-- Janus auth wall — embedded, self-contained (zero external
     resources). One page, two states: the login form when no valid
     session is presented, the signed-in status page (which IS the
     logout UI for every guarded app) when one is. Every dynamic value
     renders through html/template escaping. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{if .User}}Signed in · {{.Host}}{{else}}Sign in · {{.Host}}{{end}}</title>
<!-- Theme is applied before first paint. Reading the stored choice from
     the body, or in the toggle script below, would render the system
     theme first and flip a moment later — on a page whose whole job is
     to appear for two seconds, that flash is most of what you see. -->
<script>
  (function () {
    try {
      var m = localStorage.getItem("janus-theme");
      if (m === "light" || m === "dark") {
        document.documentElement.setAttribute("data-theme", m);
      }
    } catch (e) {} // private mode / storage disabled: system theme it is
  })();
</script>
<style>
  /* Three states, not two. An explicit choice stamps data-theme on the
     root; the default (auto) stamps nothing and lets the OS decide, so
     every color must resolve with no attribute present. Hence: light
     palette on bare :root, dark repeated in two places — the media
     query for auto, the attribute for a deliberate choice. */
  :root {
    color-scheme: light;
    --bg: #eef0f4; --panel: #ffffff; --line: #d9dde5;
    --text: #1a1d24; --dim: #5f6878; --accent: #3355cc; --bad: #c0392b;
    --bad-bg: rgba(192, 57, 43, .07);
    --shadow: 0 1px 2px rgba(16, 20, 30, .06), 0 8px 24px rgba(16, 20, 30, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f1115; --panel: #171a21; --line: #262b36;
      --text: #e6e9ef; --dim: #8b93a3; --accent: #7aa2f7; --bad: #f27878;
      --bad-bg: rgba(242, 120, 120, .08);
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1115; --panel: #171a21; --line: #262b36;
    --text: #e6e9ef; --dim: #8b93a3; --accent: #7aa2f7; --bad: #f27878;
    --bad-bg: rgba(242, 120, 120, .08);
    --shadow: none;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif;
    display: flex; min-height: 100vh; align-items: center; justify-content: center;
  }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 26px 28px; width: 22rem; max-width: 92vw;
    box-shadow: var(--shadow);
  }
  h1 { font-size: 19px; margin: 0 0 2px; letter-spacing: .3px; }
  .host { color: var(--accent); font-family: ui-monospace, Menlo, monospace;
    font-size: 13px; margin: 0 0 18px; word-break: break-all; }
  .err { background: var(--bad-bg); border: 1px solid var(--bad);
    color: var(--bad); border-radius: 6px; padding: 8px 10px;
    font-size: 13px; margin: 0 0 14px; }
  label { display: block; margin: 12px 0 4px; font-size: 13px; color: var(--dim); }
  input {
    width: 100%; padding: 8px 10px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    margin-top: 18px; width: 100%; padding: 9px 0; font: inherit;
    font-weight: 600; color: var(--panel); background: var(--accent);
    border: none; border-radius: 6px; cursor: pointer;
  }
  .who { margin: 0 0 4px; }
  .who strong { color: var(--accent); }
  .since { color: var(--dim); font-size: 13px; margin: 0 0 6px; }

  /* Theme toggle: one button, cycling auto -> light -> dark -> auto, so
     the system default is somewhere you can get back TO rather than only
     away from. Off in a corner — it is a convenience on a page that
     exists to take a password. */
  .theme {
    position: fixed; top: 14px; right: 14px; width: 34px; height: 34px;
    margin: 0; padding: 0; display: grid; place-items: center;
    color: var(--dim); background: transparent;
    border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .theme:hover { color: var(--text); border-color: var(--dim); }
  .theme:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .theme svg { display: none; width: 17px; height: 17px; }
  .theme[data-mode="auto"] .i-auto,
  .theme[data-mode="light"] .i-sun,
  .theme[data-mode="dark"] .i-moon { display: block; }
  @media (prefers-reduced-motion: reduce) { .theme { transition: none; } }
  /* No script, no toggle: a dead control is worse than none, and the
     page is fully usable on the system theme alone. */
  .no-js .theme { display: none; }
</style>
</head>
<body class="no-js">
<button class="theme" type="button" data-mode="auto" aria-label="Theme: system">
  <!-- half-filled circle: following the system -->
  <svg class="i-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="1.8" aria-hidden="true">
    <circle cx="12" cy="12" r="9"></circle>
    <path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"></path>
  </svg>
  <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
    <circle cx="12" cy="12" r="4.2"></circle>
    <path d="M12 2v2.2M12 19.8V22M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2 12h2.2M19.8 12H22M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"></path>
  </svg>
  <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
    <path d="M20 13.4A8.2 8.2 0 1 1 10.6 4a6.6 6.6 0 0 0 9.4 9.4z"></path>
  </svg>
</button>
<div class="card">
{{if .User}}
  <h1>Signed in</h1>
  <p class="host">{{.Host}}</p>
  <p class="who">Signed in as <strong>{{.User}}</strong></p>
  <p class="since">since {{.Since}}</p>
  <form method="post" action="{{.Door}}">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <button type="submit">Sign out</button>
  </form>
{{else}}
  <h1>Sign in</h1>
  <p class="host">{{.Host}}</p>
  {{if .Error}}<p class="err">{{.Error}}</p>{{end}}
  <form method="post" action="{{.Door}}" autocomplete="on">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <input type="hidden" name="to" value="{{.To}}">
    <label for="u">User</label>
    <input id="u" name="user" autocomplete="username" autofocus required>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
{{end}}
</div>
<script>
  (function () {
    var root = document.documentElement;
    var btn = document.querySelector(".theme");
    document.body.classList.remove("no-js");

    var order = ["auto", "light", "dark"];
    var label = { auto: "Theme: system", light: "Theme: light", dark: "Theme: dark" };

    function read() {
      try {
        var m = localStorage.getItem("janus-theme");
        return m === "light" || m === "dark" ? m : "auto";
      } catch (e) { return "auto"; }
    }

    function apply(mode) {
      if (mode === "auto") root.removeAttribute("data-theme");
      else root.setAttribute("data-theme", mode);
      btn.setAttribute("data-mode", mode);
      btn.setAttribute("aria-label", label[mode]);
      btn.title = label[mode];
      try {
        if (mode === "auto") localStorage.removeItem("janus-theme");
        else localStorage.setItem("janus-theme", mode);
      } catch (e) {} // storage unavailable: the choice lasts this page only
    }

    apply(read());
    btn.addEventListener("click", function () {
      apply(order[(order.indexOf(read()) + 1) % order.length]);
    });
  })();
</script>
</body>
</html>
