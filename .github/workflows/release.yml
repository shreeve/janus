# Release — push a v* tag and five self-contained Janus archives appear on the
# GitHub Release: osx-arm64, linux-amd64, linux-arm64, windows-amd64, and
# windows-arm64. Each archive contains the static janus binary (Caddy + the
# Janus module + the Route 53 DNS provider), the operator-facing Caddyfile,
# README, and license. Unix archives also include an install.sh that puts
# janus on PATH without touching live configuration.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit, vet, and race gates
        run: |
          go test ./...
          go vet ./...
          go test -race ./...

  acceptance:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          path: janus
      - uses: actions/checkout@v5
        with:
          repository: shreeve/rip
          path: rip
      - uses: actions/setup-go@v6
        with:
          go-version-file: janus/go.mod
          cache-dependency-path: janus/go.sum
      - uses: oven-sh/setup-bun@v2
      - name: Build acceptance binary
        working-directory: janus
        run: make janus
      - name: Full acceptance gate
        working-directory: janus
        # The suite intentionally exercises the production HTTPS port (443).
        # GitHub's macOS runner provides passwordless sudo; preserve the tool
        # path so the checked-out Rip manager can invoke Bun.
        run: sudo env "PATH=$PATH" "HOME=$HOME" NO_COLOR=1 ./test.sh

  build:
    needs: [test, acceptance]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15,        plat: osx-arm64,     goos: darwin,  goarch: arm64 }
          - { runner: ubuntu-24.04,     plat: linux-amd64,   goos: linux,   goarch: amd64 }
          - { runner: ubuntu-24.04-arm, plat: linux-arm64,   goos: linux,   goarch: arm64 }
          - { runner: windows-2025,     plat: windows-amd64, goos: windows, goarch: amd64 }
          - { runner: windows-11-arm,   plat: windows-arm64, goos: windows, goarch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      # Full fetch so the Go toolchain sees the pushed tag and VCS-stamps the
      # module version that the smoke test asserts via build-info.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Tagged builds compile the checked-out tag directly: the ldflags stamp
      # drives `janus version`, and the Go toolchain VCS-stamps the module
      # version into build-info. workflow_dispatch builds carry v0.0.0-dev.
      - name: Build Janus
        shell: bash
        run: |
          stamp="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            stamp=v0.0.0-dev
          fi
          suffix=
          [[ "${{ matrix.goos }}" == windows ]] && suffix=.exe
          mkdir -p bin
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-X main.version=$stamp" \
              -o "bin/janus$suffix" ./cmd/janus

      - name: Package
        shell: bash
        run: |
          package_tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            package_tag=v0.0.0-dev
          fi
          TAG="$package_tag" PLAT=${{ matrix.plat }} scripts/package-release.sh

      - name: Smoke-test packaged archive
        shell: bash
        run: |
          package_tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            package_tag=v0.0.0-dev
          fi
          name="janus-$package_tag-${{ matrix.plat }}"
          mkdir -p "$RUNNER_TEMP/janus-smoke"
          if [[ "${{ matrix.goos }}" == windows ]]; then
            7z x "dist/$name.zip" -o"$RUNNER_TEMP/janus-smoke" -y >/dev/null
            exe="$RUNNER_TEMP/janus-smoke/$name/janus.exe"
          else
            tar -C "$RUNNER_TEMP/janus-smoke" -xzf "dist/$name.tar.gz"
            packaged_exe="$RUNNER_TEMP/janus-smoke/$name/janus"
            install_bin="$RUNNER_TEMP/janus-install"
            mkdir -p "$install_bin"
            chmod 0700 "$install_bin"
            printf 'stale executable\n' > "$install_bin/janus"
            chmod 0755 "$install_bin/janus"
            BIN="$install_bin" "$RUNNER_TEMP/janus-smoke/$name/install.sh"
            exe="$install_bin/janus"
            [[ -x "$exe" ]]
            cmp "$packaged_exe" "$exe"
            if [[ "${{ matrix.goos }}" == darwin ]]; then
              [[ "$(stat -f '%Lp' "$install_bin")" == 700 ]]
            else
              [[ "$(stat -c '%a' "$install_bin")" == 700 ]]
            fi
            # Installing to the extraction directory is a safe no-op; the
            # installer must never delete its own source binary.
            BIN="$RUNNER_TEMP/janus-smoke/$name" \
              "$RUNNER_TEMP/janus-smoke/$name/install.sh"
            [[ -x "$packaged_exe" ]]
          fi
          # The janus module registers itself, and the Route 53 provider is
          # compiled in. Module versions live in build-info: the main module
          # never appears in list-modules --versions, so the version gates
          # assert the CLI stamp and the VCS-stamped build-info instead.
          "$exe" list-modules | grep -qx 'janus'
          "$exe" list-modules | grep -qx 'dns.providers.route53'
          "$exe" adapt \
            --config "$RUNNER_TEMP/janus-smoke/$name/Caddyfile.minimal" \
            --adapter caddyfile >/dev/null
          "$exe" adapt \
            --config "$RUNNER_TEMP/janus-smoke/$name/Caddyfile.example" \
            --adapter caddyfile >/dev/null
          caddy_version=$(awk '$1 == "github.com/caddyserver/caddy/v2" { print $2 }' go.mod)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$("$exe" version)" == "janus ${GITHUB_REF_NAME#v} (caddy ${caddy_version#v})" ]]
            "$exe" build-info | awk -v version="$GITHUB_REF_NAME" \
              '$1 == "mod" && $2 == "github.com/shreeve/janus" && $3 == version { found=1 } END { exit !found }'
          else
            [[ "$("$exe" version)" == "janus 0.0.0-dev (caddy ${caddy_version#v})" ]]
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: janus-${{ github.ref_name }}-${{ matrix.plat }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with: { merge-multiple: true }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          caddy_version=$(awk '$1 == "github.com/caddyserver/caddy/v2" { print $2 }' go.mod)
          sha256sum janus-*.tar.gz janus-*.zip > "janus-$GITHUB_REF_NAME-checksums.txt"
          gh release create "$GITHUB_REF_NAME" \
            janus-*.tar.gz janus-*.zip "janus-$GITHUB_REF_NAME-checksums.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Janus $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Caddy $caddy_version with Janus $GITHUB_REF_NAME. The binary is named janus and bundles the Route 53 DNS provider for DNS-01 wildcard certificates. Five self-contained archives for macOS ARM64, Linux AMD64/ARM64, and Windows AMD64/ARM64. Each archive includes the janus binary, Caddyfile.minimal, Caddyfile.example, README, and license; Unix archives also include install.sh."
