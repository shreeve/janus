# Release — push a v* tag and five self-contained Janus archives appear on the
# GitHub Release: osx-arm64, linux-amd64, linux-arm64, windows-amd64, and
# windows-arm64. Each archive contains the janus binary (Caddy + the
# Janus module + the Route 53 DNS provider), the operator-facing Caddyfile,
# README, and license. Unix archives also include an install.sh that puts
# janus on PATH without touching live configuration.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/check.yml

  build:
    needs: [checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15,        plat: osx-arm64,     goos: darwin,  goarch: arm64 }
          - { runner: ubuntu-24.04,     plat: linux-amd64,   goos: linux,   goarch: amd64 }
          - { runner: ubuntu-24.04-arm, plat: linux-arm64,   goos: linux,   goarch: arm64 }
          - { runner: windows-2025,     plat: windows-amd64, goos: windows, goarch: amd64 }
          - { runner: windows-11-arm,   plat: windows-arm64, goos: windows, goarch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      # Full fetch so the Go toolchain sees the pushed tag and VCS-stamps the
      # module version that the smoke test asserts via build-info.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # No build cache: a release compiles from the module proxy's verified
      # sources alone, never from a cache another workflow run could have
      # written.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      # Tagged builds compile the checked-out tag directly: the ldflags stamp
      # drives `janus version`, and the Go toolchain VCS-stamps the module
      # version into build-info. workflow_dispatch builds carry v0.0.0-dev.
      # CGO_ENABLED=0: a Linux binary built on the runner would otherwise
      # link the runner's glibc and refuse to start on an older one. Nothing
      # in Janus needs cgo (on macOS, os/user and net call libSystem without
      # it), and code signing is indifferent.
      - name: Build Janus
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          stamp="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            stamp=v0.0.0-dev
          fi
          suffix=
          [[ "${{ matrix.goos }}" == windows ]] && suffix=.exe
          mkdir -p bin
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-X main.version=$stamp" \
              -o "bin/janus$suffix" ./cmd/janus

      # macOS Local Network privacy files its allow/deny under the executable's
      # code-signing identifier; one stable name keeps the grant across
      # upgrades. The archive installer and install.sh apply the same name.
      - name: Sign (macOS)
        if: matrix.goos == 'darwin'
        run: codesign -s - -f -i com.github.shreeve.janus bin/janus

      - name: Package
        shell: bash
        run: |
          package_tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            package_tag=v0.0.0-dev
          fi
          TAG="$package_tag" PLAT=${{ matrix.plat }} scripts/package-release.sh

      - name: Smoke-test packaged archive
        shell: bash
        run: |
          package_tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            package_tag=v0.0.0-dev
          fi
          name="janus-$package_tag-${{ matrix.plat }}"
          mkdir -p "$RUNNER_TEMP/janus-smoke"
          if [[ "${{ matrix.goos }}" == windows ]]; then
            7z x "dist/$name.zip" -o"$RUNNER_TEMP/janus-smoke" -y >/dev/null
            exe="$RUNNER_TEMP/janus-smoke/$name/janus.exe"
          else
            tar -C "$RUNNER_TEMP/janus-smoke" -xzf "dist/$name.tar.gz"
            packaged_exe="$RUNNER_TEMP/janus-smoke/$name/janus"
            install_bin="$RUNNER_TEMP/janus-install"
            mkdir -p "$install_bin"
            chmod 0700 "$install_bin"
            printf 'stale executable\n' > "$install_bin/janus"
            chmod 0755 "$install_bin/janus"
            BIN="$install_bin" "$RUNNER_TEMP/janus-smoke/$name/install.sh"
            exe="$install_bin/janus"
            [[ -x "$exe" ]]
            if [[ "${{ matrix.goos }}" == darwin ]]; then
              # The command is a symlink into the installed bundle, which is
              # a verified copy of the packaged one.
              [[ -L "$exe" ]]
              [[ "$(readlink "$exe")" == "$HOME/Applications/Janus.app/Contents/MacOS/janus" ]]
              cmp "$RUNNER_TEMP/janus-smoke/$name/Janus.app/Contents/MacOS/janus" "$HOME/Applications/Janus.app/Contents/MacOS/janus"
              codesign --verify --strict "$HOME/Applications/Janus.app"
              [[ "$(codesign -dv "$HOME/Applications/Janus.app" 2>&1 | sed -n 's/^Identifier=//p')" == com.github.shreeve.janus ]]
              [[ "$(plutil -extract CFBundleShortVersionString raw "$HOME/Applications/Janus.app/Contents/Info.plist")" == "${package_tag#v}" ]]
              [[ "$(stat -f '%Lp' "$install_bin")" == 700 ]]
            else
              cmp "$packaged_exe" "$exe"
              [[ "$(stat -c '%a' "$install_bin")" == 700 ]]
            fi
            # Installing to the extraction directory is a safe no-op; the
            # installer must never delete its own source binary.
            BIN="$RUNNER_TEMP/janus-smoke/$name" \
              "$RUNNER_TEMP/janus-smoke/$name/install.sh"
            [[ -x "$packaged_exe" ]]
          fi
          # The janus module registers itself, and the Route 53 provider is
          # compiled in. Module versions live in build-info: the main module
          # never appears in list-modules --versions, so the version gates
          # assert the CLI stamp and the VCS-stamped build-info instead.
          # Capture the list once and grep the text: piping the binary
          # straight into `grep -q` lets grep close the pipe on its first
          # match while the binary is still writing, and the resulting
          # SIGPIPE (exit 141) fails the step under pipefail by timing.
          modules=$("$exe" list-modules)
          grep -qx 'janus' <<<"$modules"
          grep -qx 'dns.providers.route53' <<<"$modules"
          "$exe" adapt \
            --config "$RUNNER_TEMP/janus-smoke/$name/Caddyfile.minimal" \
            --adapter caddyfile >/dev/null
          "$exe" adapt \
            --config "$RUNNER_TEMP/janus-smoke/$name/Caddyfile.example" \
            --adapter caddyfile >/dev/null
          caddy_version=$(awk '$1 == "github.com/caddyserver/caddy/v2" { print $2 }' go.mod)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$("$exe" version)" == "janus ${GITHUB_REF_NAME#v} (caddy ${caddy_version#v})" ]]
            "$exe" build-info | awk -v version="$GITHUB_REF_NAME" \
              '$1 == "mod" && $2 == "github.com/shreeve/janus" && $3 == version { found=1 } END { exit !found }'
          else
            [[ "$("$exe" version)" == "janus 0.0.0-dev (caddy ${caddy_version#v})" ]]
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: janus-${{ github.ref_name }}-${{ matrix.plat }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # Signed build provenance for every archive (Sigstore, stored with the
  # repository's attestations): `gh attestation verify <archive> -R
  # shreeve/janus` checks one. The only job that may mint an OIDC token.
  attest:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { merge-multiple: true }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            janus-*.tar.gz
            janus-*.zip

  release:
    needs: [build, attest]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { merge-multiple: true }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          caddy_version=$(awk '$1 == "github.com/caddyserver/caddy/v2" { print $2 }' go.mod)
          sha256sum janus-*.tar.gz janus-*.zip > "janus-$GITHUB_REF_NAME-checksums.txt"
          gh release create "$GITHUB_REF_NAME" \
            janus-*.tar.gz janus-*.zip "janus-$GITHUB_REF_NAME-checksums.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Janus $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Caddy $caddy_version with Janus $GITHUB_REF_NAME. The binary is named janus and bundles the Route 53 DNS provider for DNS-01 wildcard certificates. Five self-contained archives for macOS ARM64, Linux AMD64/ARM64, and Windows AMD64/ARM64. Each archive includes janus (on macOS as Janus.app with the command linked into it), Caddyfile.minimal, Caddyfile.example, README, and license; Unix archives also include install.sh."
