name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit, vet, and race gates
        run: |
          go test ./...
          go vet ./...
          go test -race ./...

  vuln:
    name: Reachable vulnerabilities
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      # The pinned govulncheck fails the job on any vulnerability the code
      # can reach, in the toolchain's standard library or a module, for
      # both platforms the edge is built for (the Go code differs).
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck="$(go env GOPATH)/bin/govulncheck"
          "$govulncheck" ./...
          GOOS=darwin "$govulncheck" ./...

  acceptance:
    name: Foreground acceptance
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: janus
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: shreeve/rip
          # The reviewed, locally tested integration revision. Update this
          # deliberately with the tenant acceptance results.
          ref: 80567de72fa0b24f322e91a07ec09647ff26c38f
          path: rip
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: janus/go.mod
          cache-dependency-path: janus/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Record integration provenance
        run: |
          git -C janus rev-parse HEAD
          git -C rip rev-parse HEAD
          go version
          bun --version
      - name: Build acceptance binary
        working-directory: janus
        run: make janus
      - name: Full acceptance gate
        working-directory: janus
        # Keep one foreground owner. The runner needs privilege for 443.
        run: sudo env "PATH=$PATH" "HOME=$HOME" NO_COLOR=1 KEEP_TEST_STATE=1 ./test.sh
      - name: Make privileged fixture logs readable
        if: always()
        run: |
          for state_dir in /tmp/janus-test.*; do
            [[ -d "$state_dir" ]] || continue
            sudo chmod -R a+rX "$state_dir"
          done
      - name: Retain acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-state
          path: /tmp/janus-test.*/**/*.log
          if-no-files-found: ignore
